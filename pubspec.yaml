name: nexus
description: "Yet another Matrix client"
version: 0.1.0
publish_to: none

flutter:
  fonts:
    - family: fallback-emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: fallback-sans
      fonts:
        - asset: assets/fonts/Roboto.ttf
  assets:
    - assets/
  uses-material-design: true

environment:
  sdk: "^3.12.2"

dependency_overrides:
  path_provider_android: 2.2.23 # Pinned to avoid JNI
  linkify:
    git:
      url: https://github.com/appelladev/linkify
      ref: fix/consecutive-periods-loose-url

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  hooks_riverpod: 3.3.2
  intl: 0.20.2
  fast_immutable_collections: 11.2.0
  path_provider: 2.1.6
  url_launcher: 6.3.2
  freezed_annotation: 3.1.0
  image_picker: ^1.2.3
  path: 1.9.1
  dynamic_color: 1.8.1
  collection: 1.19.1
  window_manager: 0.5.2
  color_hash: 1.0.1
  flutter_widget_from_html_core: 0.17.2
  flutter_svg: 2.3.0
  json_annotation: 4.12.0
  shared_preferences: 2.5.5
  fluttertagger: 2.3.2
  dynamic_polls: 0.0.7
  flutter_hooks: 0.21.3+1
  ffi: 2.2.0
  hooks: 2.0.2
  code_assets: 1.2.1
  ffigen: 20.1.1
  timeago: 3.7.1
  http: 1.6.0
  flutter_linkify: 6.0.0
  linkify: 5.0.0
  emoji_text_field:
    git:
      url: https://github.com/Henry-Hiles/emoji_text_field
  flutter_blurhash: 0.9.1
  super_sliver_list: 0.4.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  measure_size: 5.0.2
  m3e_buttons: 0.0.4
  navigation_rail_m3e:
    git:
      url: https://github.com/Henry-Hiles/material_3_expressive
      path: packages/navigation_rail_m3e
  m3e_card_list: 0.1.0
  xdg_directories: 1.1.0
  package_info_plus: 10.2.1
  app_links: 7.2.1
  file_selector: ^1.1.0
  
dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: 6.0.0
  freezed: 3.2.6-dev.1
  riverpod_lint: 3.1.4
  flutter_launcher_icons: 0.14.4
  json_serializable: 6.14.0

flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon.png
  adaptive_icon_background: assets/background.png
  adaptive_icon_foreground: assets/foreground.png
  adaptive_icon_monochrome: assets/monochrome.png
  remove_alpha_ios: true
  windows:
    generate: true