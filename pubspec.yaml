name: nexus
description: "A simple and user-friendly Matrix client"
version: 1.1.0-alpha1
publish_to: none

flutter:
    fonts:
        - family: bundled-sans
          fonts:
              - asset: assets/fonts/Inter.ttf
        - family: bundled-mono
          fonts:
              - asset: assets/fonts/AtkinsonHyperlegibleMono.ttf
    assets:
        - assets/bundled/
    uses-material-design: true

environment:
    sdk: ^3.13.3

dependency_overrides:
    dynamic_color: 2.1.0
    code_assets: 2.1.0 # webcrypto requires ^1.0.0, but works with 2.x
    webcrypto:
        git:
            url: https://github.com/google/webcrypto.dart # Uses build hooks and fixes macOS x86_64, unreleased
    native_toolchain_cmake:
        git:
            url: https://github.com/rainyl/native_toolchain_cmake # Fixes native aarch64 linux builds, unreleased
    m3e_design:
        git:
            url: https://github.com/Henry-Hiles/material_3_expressive
            path: packages/m3e_design
    fab_m3e:
        git:
            url: https://github.com/Henry-Hiles/material_3_expressive
            path: packages/fab_m3e
    unifiedpush_linux:
        git:
            url: https://codeberg.org/Henry-Hiles/flutter-connector
            ref: quad/nexus
            path: unifiedpush_linux
    unifiedpush_platform_interface:
        git:
            url: https://codeberg.org/Henry-Hiles/flutter-connector
            ref: quad/nexus
            path: unifiedpush_platform_interface
    linkify:
        git:
            url: https://github.com/appelladev/linkify
            ref: fix/consecutive-periods-loose-url

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    flutter_riverpod: 3.4.3
    hooks_riverpod: 3.4.3
    intl: 0.20.3
    fast_immutable_collections: 11.2.1
    path_provider: 2.1.6
    url_launcher: 6.3.3
    freezed_annotation: 3.1.0
    image_picker: 1.2.4
    path: 1.9.1
    dynamic_color: 2.1.0
    collection: 1.19.1
    window_manager: 0.6.0
    color_hash: 1.0.1
    flutter_widget_from_html_core: 0.18.0-beta.1
    flutter_svg: 2.3.2
    json_annotation: 4.12.0
    shared_preferences: 2.5.6
    fluttertagger:
        git:
            url: https://github.com/Henry-Hiles/fluttertagger # Fixes the last tag search being dropped from formattedText
    flutter_hooks: 0.21.3+1
    ffi: 2.2.0
    hooks: 2.2.0
    code_assets: 2.1.0
    ffigen: 23.0.0
    timeago: 3.7.1
    http: 1.6.0
    linkify: 5.0.0
    html: 0.15.7
    flutter_blurhash: 0.9.1
    super_sliver_list: 0.4.1
    media_kit: 1.2.6
    media_kit_video: 2.0.1
    media_kit_libs_video: 1.0.7
    measure_size: 5.0.2
    m3e_buttons: 1.0.4
    m3e_design: 0.2.1
    navigation_rail_m3e:
        git:
            url: https://github.com/Henry-Hiles/material_3_expressive
            path: packages/navigation_rail_m3e
    m3e_card_list: 1.0.0
    xdg_directories: 1.1.0
    package_info_plus: 10.2.2
    app_links: 7.2.2
    file_selector: 1.1.0
    material_ui: 1.9.0
    multi_state_switch: 1.1.0
    unifiedpush: 6.2.0
    unifiedpush_storage_shared_preferences: 1.0.0
    flutter_local_notifications: 22.3.3
    timezone: 0.11.2
    material_emoji_picker: 2.0.1+1
    material_adaptive_sheets: 1.0.0
    xdg_desktop_portal:
        git:
            url: https://github.com/Henry-Hiles/xdg_desktop_portal.dart
            ref: quad/nexus
    pasteboard: 0.6.0
    flutter_file_dialog: 3.3.3
    mime: 2.1.0
    avif_native: 0.2.0
    flutter_map: 8.3.2
    latlong2: 0.10.1
    geolocator: 14.1.2
dev_dependencies:
    flutter_test:
        sdk: flutter
    integration_test:
        sdk: flutter
    app_links_platform_interface: 2.0.4
    url_launcher_platform_interface: 2.3.2
    build_runner: 2.17.1
    flutter_lints: 6.0.0
    freezed: 4.0.3
    riverpod_lint: 3.1.9
    flutter_launcher_icons: 0.14.4
    json_serializable: 6.15.2

flutter_launcher_icons:
    image_path: assets/icon.png
    ios: true
    image_path_ios: assets/mobile.png
    android: true
    adaptive_icon_background: assets/background.png
    adaptive_icon_foreground: assets/foreground.png
    adaptive_icon_monochrome: assets/monochrome.png
    windows:
        generate: true
    macos:
        generate: true
        image_path: assets/mobile.png

hooks:
    user_defines:
        avif_native:
            features: decode
