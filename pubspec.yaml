name: nexus
description: "A simple and user-friendly Matrix client"
version: 0.1.0
publish_to: none

flutter:
    fonts:
        - family: fallback-emoji
          fonts:
              - asset: assets/fonts/NotoColorEmoji.ttf
        - family: fallback-sans
          fonts:
              - asset: assets/fonts/Roboto.ttf
    assets:
        - assets/

environment:
    sdk: 3.13.0

dependency_overrides:
    dynamic_color: 2.1.0
    path_provider_android: 2.2.23 # Pinned to avoid JNI
    linkify:
        git:
            url: https://github.com/appelladev/linkify
            ref: fix/consecutive-periods-loose-url

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    flutter_riverpod: 3.4.2
    hooks_riverpod: 3.4.2
    intl: 0.20.3
    fast_immutable_collections: 11.2.0
    path_provider: 2.1.6
    url_launcher: 6.3.2
    freezed_annotation: 3.1.0
    image_picker: 1.2.3
    path: 1.9.1
    dynamic_color: 2.1.0
    collection: 1.19.1
    window_manager: 0.5.2
    color_hash: 1.0.1
    flutter_widget_from_html_core: 0.17.2
    flutter_svg: 2.3.0
    json_annotation: 4.12.0
    shared_preferences: 2.5.5
    fluttertagger: 2.3.2
    dynamic_polls: 0.0.8
    flutter_hooks: 0.21.3+1
    ffi: 2.2.0
    hooks: ^2.2.0
    code_assets: 1.2.1
    ffigen: 21.0.0
    timeago: 3.7.1
    http: 1.6.0
    flutter_linkify: 6.0.0
    linkify: 5.0.0
    emoji_text_field:
        git:
            url: https://github.com/Henry-Hiles/emoji_text_field
    flutter_blurhash: 0.9.1
    super_sliver_list: 0.4.1
    media_kit: 1.2.6
    media_kit_video: 2.0.1
    media_kit_libs_video: 1.0.7
    measure_size: 5.0.2
    m3e_buttons: 1.0.0
    navigation_rail_m3e:
        git:
            url: https://github.com/Henry-Hiles/material_3_expressive
            path: packages/navigation_rail_m3e
    m3e_card_list: 1.0.0
    xdg_directories: 1.1.0
    package_info_plus: 10.2.1
    app_links: 7.2.1
    file_selector: 1.1.0
    material_ui: 1.0.1

dev_dependencies:
    build_runner: 2.16.0
    flutter_lints: 6.0.0
    freezed: 4.0.0
    riverpod_lint: 3.1.8
    flutter_launcher_icons: 0.14.4
    json_serializable: 6.14.1

flutter_launcher_icons:
    image_path: assets/icon.png
    ios: true
    image_path_ios: assets/mobile.png
    android: true
    adaptive_icon_background: assets/background.png
    adaptive_icon_foreground: assets/foreground.png
    adaptive_icon_monochrome: assets/monochrome.png
    windows:
        generate: true
    macos:
        generate: true
        image_path: assets/mobile.png
