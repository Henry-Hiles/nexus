analyzer:
    errors:
        invalid_annotation_target: ignore
        avoid_print: ignore
        annotate_overrides: ignore
    exclude:
        - "build/**"
        - "**/*.g.dart"
        - "**/*.freezed.dart"
        - android/**
        - ios/**
        - web/**
        - windows/**
        - macos/**
        - linux/**
include: package:flutter_lints/flutter.yaml
linter:
    rules:
        prefer_double_quotes: true
