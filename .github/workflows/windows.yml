name: "Build EXE"

on:
    push:
        branches: ["main"]
        tags: ["*"]
    workflow_dispatch:

jobs:
    build-exe:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: 3.47.4

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: gomuks/go.mod

            - name: Setup MSYS2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: CLANG64
                  install: >-
                      mingw-w64-x86_64-gcc

            - name: Go build
              run: |
                  cd gomuks/pkg/ffi
                  go build -tags goolm,sqlite_fts5 -o ../../../libgomuks.dll -buildmode=c-shared

            - name: Build with Flutter
              run: |
                  flutter pub get
                  dart scripts/generate.dart
                  flutter pub run build_runner build
                  flutter build windows --dart-define=GIT_COMMIT=${{ github.sha }}

            # better_player plays videos with libmpv, but doesn't bundle it
            - name: Download libmpv
              shell: powershell
              run: |
                  $archive = "$env:RUNNER_TEMP\mpv.7z"
                  Invoke-WebRequest "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z" -OutFile $archive
                  if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne "273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452") {
                      throw "libmpv checksum mismatch"
                  }
                  7z e $archive libmpv-2.dll -obuild/windows/x64/runner/Release

            - name: Copy MinGW runtime DLLs
              shell: msys2 {0}
              run: |
                  cp /mingw64/bin/libgcc_s_seh-1.dll build/windows/x64/runner/Release/
                  cp /mingw64/bin/libwinpthread-1.dll build/windows/x64/runner/Release/
                  cp /mingw64/bin/libstdc++-6.dll build/windows/x64/runner/Release/

            - name: Copy MSVC runtime DLLs
              shell: powershell
              run: |
                  $release = "build/windows/x64/runner/Release"

                  Copy-Item C:\Windows\System32\MSVCP140.dll $release -Force
                  Copy-Item C:\Windows\System32\VCRUNTIME140.dll $release -Force
                  Copy-Item C:\Windows\System32\VCRUNTIME140_1.dll $release -Force

            - name: Install Inno Setup
              run: choco install innosetup -y

            - name: Build Inno Setup installer
              run: iscc windows/installer.iss

            - name: Upload installer artifact
              uses: actions/upload-artifact@v6
              with:
                  name: windows-installer
                  path: windows/dist/Nexus-Setup.exe
