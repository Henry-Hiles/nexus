name: "End-to-end tests"

on:
    schedule:
        - cron: "0 6 * * 1"
    pull_request:
    workflow_dispatch:

jobs:
    e2e:
        runs-on: ["large-mem", "debian-13-x86_64"]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  submodules: recursive

            - name: Lix GHA Installer Action
              uses: samueldr/lix-gha-installer-action@v2026-02-22
              with:
                  extra_nix_config: experimental-features = nix-command flakes flake-self-attrs

            - name: Generate code
              run: nix develop --command bash -c "flutter pub get && dart scripts/generate.dart && flutter pub run build_runner build"

            - name: Run end-to-end tests
              run: nix run .#e2e-headless
